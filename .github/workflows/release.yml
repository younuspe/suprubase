name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Python with distutils
        run: |
          brew install python@3.12
          echo "/opt/homebrew/opt/python@3.12/libexec/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w node-pty

      - name: Build application
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify build output
        run: |
          ls -la dist/
          file dist/*.dmg 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supru-macos-${{ runner.arch }}
          path: dist/*.dmg
          retention-days: 30

      - name: Create Release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
