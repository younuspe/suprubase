name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint 2>/dev/null || echo "No lint script configured"

  build-macos:
    name: Build macOS (verify)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Setup Python with distutils
        run: |
          brew install python@3.12
          echo "/opt/homebrew/opt/python@3.12/libexec/bin" >> $GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npx @electron/rebuild -f -w node-pty
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Supru-macos-verify
          path: dist/*.dmg
          retention-days: 7
