name: macOS Build (Explicit Xcode 15.4)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build macOS with Explicit Xcode 15.4
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 15.4 explicitly
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "DEVELOPER_DIR=$(xcode-select -p)"

      - name: Setup Python with distutils
        run: |
          brew install python@3.12
          echo "/opt/homebrew/opt/python@3.12/libexec/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w node-pty

      - name: Build .dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Supru-macos-explicit-xcode
          path: dist/*.dmg
          retention-days: 30
