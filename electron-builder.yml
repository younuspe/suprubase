# electron-builder.yml
appId: com.example.supru
productName: Supru
directories:
  output: dist
  buildResources: build
files:
  - '**/*'
  - '!src/renderer/**/*.test.*'
  - '!src/main/**/*.test.*'
  - '!**/*.{iml,o,hprof,cls,py,pyc,pyo,rb,swp,csproj,sln,xproj}'
  - '!package-lock.json'
  - '!.DS_Store'
  - '!electron-builder.yml'
  - '!test_*.js'
  - '!debug_*.js'
  - '!simple_*.js'
  - '!runtime_test.js'
  - '!m9-build-error.txt'
  - '!*.out'
  - '!*.bak'
  - '!/CLAUDE.md'
  - '!/ROADMAP.md'
  - '!/M*_COMPLETED.txt'
  - '!/README.md'
asarUnpack:
  - node-pty/**/*
  - node-pty-build/**/*
publish: null  # Disable auto-publishing
mac:
  target: dmg
  icon: build/icon.icns
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: AppImage
  icon: build/icon.png
